name: koivulahti

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koivulahti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koivulahti}
      POSTGRES_DB: ${POSTGRES_DB:-koivulahti}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migration-runner:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-koivulahti}
      PGPASSWORD: ${POSTGRES_PASSWORD:-koivulahti}
      PGDATABASE: ${POSTGRES_DB:-koivulahti}
    volumes:
      - ../migrations:/migrations:ro
    entrypoint: ["/bin/bash", "/migrations/run.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional local inference. The default fake provider does not start either image.
  llm-server-cpu:
    profiles: ["cpu"]
    image: ${LLM_SERVER_IMAGE_CPU:-ghcr.io/ggml-org/llama.cpp:server}
    command: >
      -m ${LLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-q4_k_m.gguf}
      -c ${LLM_CONTEXT:-4096}
      --host 0.0.0.0
      --port 8080
      --threads ${LLM_THREADS:-8}
    volumes:
      - ../models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  llm-server-gpu:
    profiles: ["gpu"]
    image: ${LLM_SERVER_IMAGE_GPU:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    command: >
      -m ${LLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-q4_k_m.gguf}
      -c ${LLM_CONTEXT:-4096}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 99
      --threads ${LLM_THREADS:-8}
    volumes:
      - ../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  llm-gateway:
    build:
      context: ..
      dockerfile: services/llm_gateway/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llm-server-cpu:8080}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://koivulahti:koivulahti@postgres:5432/koivulahti}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      migration-runner:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: ..
      dockerfile: services/engine/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://koivulahti:koivulahti@postgres:5432/koivulahti}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RENDER_QUEUE: ${RENDER_QUEUE:-render_jobs}
      DECISION_QUEUE: ${DECISION_QUEUE:-decision_jobs}
      DECISION_SERVICE_ENABLED: ${DECISION_SERVICE_ENABLED:-false}
      SIM_SEED: ${SIM_SEED:-1234}
      SIM_TICK_MS: ${SIM_TICK_MS:-1000}
      IMPACT_THRESHOLD_FEED: ${IMPACT_THRESHOLD_FEED:-0.6}
      IMPACT_THRESHOLD_CHAT: ${IMPACT_THRESHOLD_CHAT:-0.4}
      IMPACT_THRESHOLD_NEWS: ${IMPACT_THRESHOLD_NEWS:-0.8}
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  workers:
    build:
      context: ..
      dockerfile: services/workers/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://koivulahti:koivulahti@postgres:5432/koivulahti}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RENDER_QUEUE: ${RENDER_QUEUE:-render_jobs}
      LLM_GATEWAY_URL: http://llm-gateway:8081
      DECISION_SERVICE_ENABLED: ${DECISION_SERVICE_ENABLED:-false}
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy

  # Opt-in until provider health, throughput, and durable jobs are implemented.
  decision-service:
    profiles: ["decision"]
    build:
      context: ..
      dockerfile: services/decision_service/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://koivulahti:koivulahti@postgres:5432/koivulahti}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DECISION_QUEUE: ${DECISION_QUEUE:-decision_jobs}
      RENDER_QUEUE: ${RENDER_QUEUE:-render_jobs}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DECISION_MIN_INTERVAL: ${DECISION_MIN_INTERVAL:-10.0}
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # External ambient data is excluded from the deterministic pilot by default.
  ambient-worker:
    profiles: ["ambient"]
    build:
      context: ..
      dockerfile: services/ambient_worker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://koivulahti:koivulahti@postgres:5432/koivulahti}
      AMBIENT_REGION: ${AMBIENT_REGION:-Keski-Suomi}
      AMBIENT_POLL_SECONDS: ${AMBIENT_POLL_SECONDS:-3600}
      AMBIENT_WEATHER_ENABLED: ${AMBIENT_WEATHER_ENABLED:-false}
      AMBIENT_NEWS_ENABLED: ${AMBIENT_NEWS_ENABLED:-false}
      AMBIENT_SPORTS_ENABLED: ${AMBIENT_SPORTS_ENABLED:-false}
    depends_on:
      migration-runner:
        condition: service_completed_successfully

volumes:
  pgdata:
