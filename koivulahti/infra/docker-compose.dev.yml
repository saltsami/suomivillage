# Optional loopback-only host access for local diagnostics and integration tests.
# The base compose file keeps infrastructure ports inside the Docker network.
services:
  postgres:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"

  llm-gateway:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8081}:8081"

  llm-server-cpu:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${LLM_SERVER_PORT:-8080}:8080"

  llm-server-gpu:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${LLM_SERVER_PORT:-8080}:8080"
