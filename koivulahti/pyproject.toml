[project]
name = "koivulahti"
version = "0.2.0"
description = "Event-driven Finnish village simulation prototype"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<9",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "psycopg2-binary>=2.9,<3",
  "pytest>=8.3,<10",
  "rich>=13.9,<15",
  "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the Docker stack or another running service",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
